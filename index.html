<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Challan</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        h2 {
            text-align: center;
            background: #222;
            color: white;
            padding: 15px;
            margin: 0;
        }

        .buttons {
            text-align: center;
            padding: 15px;
            background: white;
        }

        .buttons a {
            display: inline-block;
            margin: 5px;
            padding: 10px 18px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .pdf-container {
            width: 100%;
            height: calc(100vh - 130px);
            background: white;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

<h2>My Challan</h2>

<div class="buttons">
    <a href="challan.pdf" target="_blank">📄 Open PDF</a>

    <a href="challan.pdf" download>⬇ Download PDF</a>

    <a href="challan.pdf" target="_blank">⛶ Full Screen</a>
</div>

<div class="pdf-container">
    <iframe src="challan.pdf"></iframe>
</div>

</body>
</html>
